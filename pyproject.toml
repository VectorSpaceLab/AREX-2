[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arex-evaluation-suite"
version = "0.1.0"
description = "AREX evaluation suite for research, algorithmic, and MLE benchmarks"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://vectorspacelab.github.io/AREX-2/"
Repository = "https://github.com/545999961/ax2"

[project.optional-dependencies]
research = ["openai", "httpx", "requests", "pandas", "pyarrow", "huggingface_hub", "pillow", "pypdf", "rich", "transformers"]
frontier = ["pyyaml", "requests", "openai", "anthropic", "datasets", "tqdm"]
all = ["openai", "httpx", "requests", "pandas", "pyarrow", "huggingface_hub", "pillow", "pypdf", "rich", "transformers", "pyyaml", "anthropic", "datasets", "tqdm"]

[project.scripts]
arex = "arex_eval.cli:main"

[tool.setuptools]
package-dir = {"" = "evaluation"}

[tool.setuptools.packages.find]
where = ["evaluation"]
include = ["arex_eval*"]
